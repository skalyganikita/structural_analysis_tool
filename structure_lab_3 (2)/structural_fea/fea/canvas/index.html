<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font:13px system-ui;color:#dce8ee;background:#14212d}#bar{display:flex;gap:5px;align-items:center;padding:10px;flex-wrap:wrap;border-bottom:1px solid #314554}button,input{font:inherit;border:1px solid #4d6475;background:#203443;color:#e4eef4;border-radius:5px;padding:7px;cursor:pointer}button.active{background:#167f88;border-color:#5ce2cc}input[type=number]{width:65px}#hint{padding:8px 12px;font-size:12px;color:#b3c7d3;min-height:34px}svg{display:block;width:100%;height:535px;touch-action:none;outline:none}text{font:12px system-ui;fill:#dce8ee;user-select:none}#status{padding:8px 12px;color:#85dccc}.member{cursor:pointer}.node{cursor:grab}button:focus-visible{outline:2px solid #f5ce67}
</style></head><body>
<div id="bar"><button data-tool="select" title="Select or drag nodes (V)">Select / move</button><button data-tool="node" title="Click empty space to add a node (N)">Add node</button><button data-tool="member" title="Click two existing nodes (M)">Draw member</button><button data-tool="pan" title="Drag background (P)">Pan</button><button id="reset" title="Fit model (F)">Reset view</button><label><input id="snap" type="checkbox" checked> Snap</label><label>Grid <input id="step" type="number" value="0.5" min="0.01" step="0.1"> m</label><label><input id="labels" type="checkbox" checked> Labels</label><label><input id="loads" type="checkbox" checked> Loads</label></div>
<div id="hint"></div><svg id="canvas" tabindex="0" aria-label="Structural modelling canvas"></svg><div id="status">Coordinates [m] · scroll to zoom</div>
<script>
// Small standalone Streamlit v1 component. No CDN, framework or build step.
const svg=document.getElementById('canvas'),NS='http://www.w3.org/2000/svg';
let args={},model={nodes:[],elements:[]},tool='select',first=null,view={cx:3,cy:1,scale:65},drag=null,pending=false,lastReset=null;
const post=(type,data={})=>parent.postMessage({isStreamlitMessage:true,type,...data},'*');
function emit(action,data={}){pending=true;post('streamlit:setComponentValue',{value:{action,...data,revision:args.revision,nonce:crypto.randomUUID()},dataType:'json'});}
function el(tag,attrs={},parentEl=svg){let n=document.createElementNS(NS,tag);for(let [k,v] of Object.entries(attrs))n.setAttribute(k,v);parentEl.appendChild(n);return n;}
function size(){return [svg.clientWidth,535]}
function screen(x,y){let [w,h]=size();return [(x-view.cx)*view.scale+w/2,h/2-(y-view.cy)*view.scale]}
function world(e){let r=svg.getBoundingClientRect();return [view.cx+(e.clientX-r.left-r.width/2)/view.scale,view.cy-(e.clientY-r.top-535/2)/view.scale]}
function snap(p){let step=Number(document.getElementById('step').value);return document.getElementById('snap').checked&&step>0?p.map(v=>Math.round(v/step)*step):p}
function line(a,b,color,width=1,attrs={}){return el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:color,'stroke-width':width,...attrs})}
function label(p,t,color='#dce8ee'){let n=el('text',{x:p[0],y:p[1],fill:color});n.style.fill=color;n.textContent=t;return n;}
function arrow(x,y,fx,fy,text,color='#75b9ff'){let norm=Math.hypot(fx,fy);if(norm<1e-9)return;let tip=screen(x,y),dir=[fx/norm,-fy/norm],tail=[tip[0]-dir[0]*48,tip[1]-dir[1]*48];line(tail,tip,color,1.7);let a=[tip[0]-dir[0]*9-dir[1]*4,tip[1]-dir[1]*9+dir[0]*4],b=[tip[0]-dir[0]*9+dir[1]*4,tip[1]-dir[1]*9-dir[0]*4];el('polygon',{points:[tip,a,b].map(p=>p.join(',')).join(' '),fill:color});if(text)label([tail[0]+5,tail[1]-7],text,color);}
function moment(p,value,color='#f68e98'){let [x,y]=p;el('path',{d:`M ${x+13} ${y+9} A 17 17 0 1 ${value>0?0:1} ${x-15} ${y-8}`,fill:'none',stroke:color,'stroke-width':2});label([x+17,y-15],`${(value/1000).toPrecision(3)} kN·m ${value>0?'↺':'↻'}`,color);}
function support(n,p){let [x,y]=p;if(n.support==='Free')return;let gold='#f5ce67';if(n.support==='Fixed'){line([x-14,y+10],[x+14,y+10],gold,2);line(p,[x,y+10],gold,2);for(let z=-12;z<=12;z+=5)line([x+z,y+10],[x+z-5,y+16],gold);}else if(['Pinned','Roller Y'].includes(n.support)){el('path',{d:`M ${x} ${y} L ${x-11} ${y+16} L ${x+11} ${y+16} Z`,fill:'none',stroke:gold,'stroke-width':2});if(n.support==='Roller Y')for(let z of [-6,6])el('circle',{cx:x+z,cy:y+21,r:3,fill:'none',stroke:gold});}else if(n.support==='Roller X'){el('path',{d:`M ${x} ${y} L ${x-16} ${y-11} L ${x-16} ${y+11} Z`,fill:'none',stroke:gold,'stroke-width':2});for(let z of [-6,6])el('circle',{cx:x-21,cy:y+z,r:3,fill:'none',stroke:gold});}else label([x+10,y+20],n.support,gold);}
function fit(){let ns=model.nodes;if(!ns.length){view={cx:3,cy:1,scale:65};return}let xs=ns.map(n=>n.x),ys=ns.map(n=>n.y),xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys);view={cx:(xmin+xmax)/2,cy:(ymin+ymax)/2,scale:Math.min((size()[0]-150)/Math.max(xmax-xmin,2),350/Math.max(ymax-ymin,2))};}
function setTool(t){tool=t;first=null;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));document.getElementById('hint').textContent={select:'Click a node/member to inspect. Drag a node to move it; release to save. V select · N node · M member · P pan · F fit · Ctrl+Z undo · Ctrl+Y redo.',node:'Click empty grid space to add a node. Snap uses the chosen grid spacing. Escape cancels.',member:'Click the START node, then the END node. Add nodes first. Crossing members do not connect automatically.',pan:'Drag the background to pan. Scroll to zoom; Reset view fits the model.'}[t];render();}
function render(){svg.replaceChildren();let [w,h]=size();let step=Number(document.getElementById('step').value)||.5;let display=step;while(display*view.scale<28)display*=2;while(display*view.scale>160)display/=2;let xmin=view.cx-w/2/view.scale,ymin=view.cy-h/2/view.scale;
for(let x=Math.ceil(xmin/display)*display;x<xmin+w/view.scale;x+=display){let p=screen(x,0);line([p[0],0],[p[0],h],Math.abs(x)<1e-8?'#526674':'#283c4a');label([p[0]+3,h-8],`${+x.toFixed(3)}`,'#7e97a6');}
for(let y=Math.ceil(ymin/display)*display;y<ymin+h/view.scale;y+=display){let p=screen(0,y);line([0,p[1]],[w,p[1]],Math.abs(y)<1e-8?'#526674':'#283c4a');label([5,p[1]-4],`${+y.toFixed(3)}`,'#7e97a6');}
let nodes=Object.fromEntries(model.nodes.map(n=>[n.id,n]));let labels=document.getElementById('labels').checked;
for(let e of model.elements){let a=nodes[e.i],b=nodes[e.j];if(!a||!b)continue;let p=screen(a.x,a.y),q=screen(b.x,b.y),L=Math.hypot(b.x-a.x,b.y-a.y);let hit=line(p,q,'transparent',18,{'data-member':e.id,class:'member'});line(p,q,e.id===args.selected_element?'#f5ce67':'#b9cdd9',e.id===args.selected_element?5:3,{'data-member':e.id,class:'member'});let title=el('title',{},hit);title.textContent=`E${e.id}: ${L.toFixed(3)} m, E ${(e.E/1e9).toFixed(1)} GPa, A ${e.A.toPrecision(4)} m², I ${e.I?.toPrecision(4)} m⁴`;
if(labels)label([(p[0]+q[0])/2+8,(p[1]+q[1])/2+18],`E${e.id} · ${+L.toFixed(3)} m`);
for(let [released,t] of [[e.release_i,.04],[e.release_j,.96]])if(released)el('circle',{cx:p[0]+t*(q[0]-p[0]),cy:p[1]+t*(q[1]-p[1]),r:5,fill:'#14212d',stroke:'#f5ce67','stroke-width':2,'pointer-events':'none'});
}
if(document.getElementById('loads').checked){
for(let p of args.patches||[]){let e=model.elements.find(e=>e.id===p.element),a=nodes[e.i],b=nodes[e.j],L=Math.hypot(b.x-a.x,b.y-a.y),c=(b.x-a.x)/L,s=(b.y-a.y)/L,fx=c*p.qx-s*p.qy,fy=s*p.qx+c*p.qy;for(let j=0;j<7;j++){let x=p.a+(p.b-p.a)*j/6;arrow(a.x+c*x,a.y+s*x,fx,fy,j===3?`${(Math.hypot(fx,fy)/1000).toPrecision(3)} kN/m`:'');}}
for(let p of args.points||[]){let e=model.elements.find(e=>e.id===p.element),a=nodes[e.i],b=nodes[e.j],L=Math.hypot(b.x-a.x,b.y-a.y),c=(b.x-a.x)/L,s=(b.y-a.y)/L;arrow(a.x+c*p.x,a.y+s*p.x,c*p.px-s*p.py,s*p.px+c*p.py,`${(Math.hypot(p.px,p.py)/1000).toPrecision(3)} kN`,'#f68e98');}
for(let p of args.nodal||[]){let n=nodes[p.node];arrow(n.x,n.y,p.fx,p.fy,`${(Math.hypot(p.fx,p.fy)/1000).toPrecision(3)} kN`,'#f68e98');if(Math.abs(p.mz)>1e-8)moment(screen(n.x,n.y),p.mz);}}
for(let n of model.nodes){let p=screen(n.x,n.y);support(n,p);let circle=el('circle',{cx:p[0],cy:p[1],r:n.id===args.selected_node||n.id===first?8:6,fill:n.id===args.selected_node||n.id===first?'#f5ce67':'#d1e4ee',stroke:'#14212d','stroke-width':2,'data-node':n.id,class:'node'});let title=el('title',{},circle);title.textContent=`N${n.id}: (${n.x}, ${n.y}) m · ${n.support}`;if(labels)label([p[0]+10,p[1]-10],`N${n.id}`,'#f5ce67');}
}
svg.addEventListener('pointerdown',e=>{if(pending)return;svg.focus();let nid=e.target.getAttribute('data-node'),eid=e.target.getAttribute('data-member'),p=snap(world(e));if(tool==='pan'||e.button===1){drag={pan:true,start:[e.clientX,e.clientY],view:{...view}};svg.setPointerCapture(e.pointerId);return;}
if(tool==='node'){if(!nid&&!eid)emit('add_node',{x:p[0],y:p[1]});return;}
if(tool==='member'){if(nid){if(first===null){first=Number(nid);document.getElementById('hint').textContent=`Start N${first} chosen. Click the END node.`;render();}else if(first!==Number(nid)){emit('add_member',{i:first,j:Number(nid)});first=null;}}return;}
if(nid){drag={id:Number(nid),start:[e.clientX,e.clientY],original:{...model.nodes.find(n=>n.id===Number(nid))},moved:false};svg.setPointerCapture(e.pointerId);}else if(eid)emit('select',{kind:'element',id:Number(eid)});
});
svg.addEventListener('pointermove',e=>{let p=snap(world(e));document.getElementById('status').textContent=`X ${p[0].toFixed(3)} m · Y ${p[1].toFixed(3)} m · equal axis scale · wheel: zoom`;
if(!drag)return;if(drag.pan){view.cx=drag.view.cx-(e.clientX-drag.start[0])/view.scale;view.cy=drag.view.cy+(e.clientY-drag.start[1])/view.scale;}else if(Math.hypot(e.clientX-drag.start[0],e.clientY-drag.start[1])>4){drag.moved=true;let n=model.nodes.find(n=>n.id===drag.id);n.x=p[0];n.y=p[1];}render();});
svg.addEventListener('pointerup',e=>{if(!drag)return;let d=drag;drag=null;if(d.pan)return;let n=model.nodes.find(n=>n.id===d.id);if(d.moved)emit('move_node',{id:d.id,x:n.x,y:n.y});else emit('select',{kind:'node',id:d.id});});
svg.addEventListener('pointercancel',()=>{if(drag&&!drag.pan)Object.assign(model.nodes.find(n=>n.id===drag.id),drag.original);drag=null;render();});
svg.addEventListener('wheel',e=>{e.preventDefault();let before=world(e);view.scale=Math.max(5,Math.min(1500,view.scale*Math.exp(-e.deltaY*.001)));let after=world(e);view.cx+=before[0]-after[0];view.cy+=before[1]-after[1];render();},{passive:false});
svg.addEventListener('keydown',e=>{if(e.ctrlKey&&['z','y'].includes(e.key.toLowerCase())){e.preventDefault();emit(e.key.toLowerCase()==='z'&&!e.shiftKey?'undo':'redo');return;}let map={v:'select',n:'node',m:'member',p:'pan'};if(map[e.key.toLowerCase()])setTool(map[e.key.toLowerCase()]);if(e.key.toLowerCase()==='f'){fit();render();}if(e.key==='Escape')setTool('select');});
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));document.getElementById('reset').onclick=()=>{fit();render()};for(let id of ['step','labels','loads'])document.getElementById(id).onchange=render;
window.addEventListener('message',e=>{if(e.source!==parent||e.data.type!=='streamlit:render')return;args=e.data.args;model=structuredClone(args.model);pending=false;if(lastReset!==args.reset){lastReset=args.reset;fit();}setTool(args.tool||tool);post('streamlit:setFrameHeight',{height:655});});
new ResizeObserver(()=>render()).observe(svg);setTool('select');post('streamlit:componentReady',{apiVersion:1});post('streamlit:setFrameHeight',{height:655});
</script></body></html>
